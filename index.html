
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>富士見町会・会員登録</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      font-size: 18px;
      line-height: 1.7;
    }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 18px;
      font-size: 18px;
    }
    button {
      background: #247a55;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h2>富士見町会・会員登録</h2>
  <p>お名前とお住まいの丁目を入力してください。</p>

  <form id="registrationForm">
    <label for="lastName">姓</label>
    <input id="lastName" required>

    <label for="firstName">名</label>
    <input id="firstName" required>

    <label for="chome">お住まいの丁目</label>
    <select id="chome" required>
      <option value="">選択してください</option>
      <option value="野田町1丁目">野田町1丁目</option>
      <option value="野田町2丁目">野田町2丁目</option>
      <option value="野田町5丁目">野田町5丁目</option>
    </select>

    <button type="submit">入力内容を確認</button>
  </form>

  <p id="message">LINE認証を確認しています...</p>

  <script>
    const message = document.getElementById("message");

    document.getElementById("registrationForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const lastName =
          document.getElementById("lastName").value.trim();
        const firstName =
          document.getElementById("firstName").value.trim();
        const chome =
          document.getElementById("chome").value;

        message.textContent =
          "確認：" + lastName + " " + firstName + "／" + chome;
      });

    async function initializeLiff() {
      try {
        if (typeof liff === "undefined") {
          throw new Error("LIFF SDKを読み込めません");
        }

        await liff.init({
          liffId: "2012181411-C8v9ylN7"
        });

        if (!liff.isLoggedIn()) {
          message.textContent = "LINEログインが必要です。";
          return;
        }

        const token = liff.getIDToken();
        message.textContent = token
          ? "LINE認証情報を取得しました。"
          : "LINE認証情報を取得できませんでした。";

      } catch (error) {
        message.textContent =
          "LINE接続エラー：" + error.message;
      }
    }

    window.addEventListener("load", initializeLiff);
  </script>
</body>
</html>
